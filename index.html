/* Design tokens. Layout concept: a veterinary parasitology laboratory atlas.
   Journal-grade serif headlines, lab-report grids, specimen-slide labels,
   hard edges, and solid blue and pink slabs reserved for the key moments. */
:root {
  /* Palette */
  /* Blue and pink after the H&E stain used in veterinary histopathology:
     haematoxylin stains nuclei blue, eosin stains cytoplasm pink. */
  --ink: #060814;          /* blue-black: page ground */
  --navy: #0A0F24;         /* deep navy: banded sections */
  --navy-2: #10173A;       /* raised surfaces */
  --blue: #5B8CFF;         /* haematoxylin blue: actions, lines, active states */
  --blue-soft: #A9C1FF;    /* light blue: secondary accent text */
  --pink: #FF6AAE;         /* eosin pink: accents, emphasis, slabs */
  --pink-soft: #FFB3D4;    /* light pink */
  --paper: #F3F4FB;        /* primary text */
  --muted: #9AA2BF;        /* secondary text */
  --dim: #5C6485;          /* tertiary, placeholders */

  --line: rgba(243, 244, 251, 0.10);
  --line-2: rgba(243, 244, 251, 0.22);
  --line-3: rgba(243, 244, 251, 0.5);

  /* Type */
  --f-display: "Source Serif 4", "Source Serif Pro", "Iowan Old Style", Georgia, serif;
  --f-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --t-xs: 0.6875rem;   /* 11px labels */
  --t-sm: 0.9375rem;
  --t-md: 1.0625rem;
  --t-lg: clamp(1.2rem, 1.7vw, 1.5rem);
  --t-xl: clamp(1.6rem, 3vw, 2.6rem);
  --t-display: clamp(2.9rem, 7.6vw, 8rem);

  /* Layout */
  --maxw: 1480px;
  --gutter: clamp(20px, 4vw, 56px);
  --nav-h: 76px;
  --sec-pad: clamp(104px, 13vw, 184px);
  --stroke: clamp(1.5px, 0.18vw, 2.5px);

  /* Motion */
  --ease: cubic-bezier(0.16, 0.84, 0.24, 1);
  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);

  color-scheme: dark;
}

</style>

*, *::before, *::after { box-sizing: border-box; }

  background: var(--ink);
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 8px);

  font-family: var(--f-sans);
  font-size: var(--t-md);

/* ---------- Type primitives ---------- */
/* Slide-label tag: the recurring "specimen label" device */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px; justify-self: start; align-self: start;

/* Accent words follow the convention for taxonomic names: italic */
.display em, .hero__title em {

}

  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em;

}

/* ---------- Placeholders (designed "awaiting content" states) ---------- */
.ph-inline { color: var(--dim); border-bottom: 1px dashed var(--line-2); font-style: normal; }
.ph-block { display: grid; gap: 12px; padding-block: 4px; max-width: 62ch; }
.ph-label {
  display: inline-flex; align-items: center; gap: 10px; margin-bottom: 4px;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
}
.ph-label i, .ph-tag i, .btn--pending i { width: 7px; height: 7px; background: var(--pink); animation: blink 1.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.ph-line {
  display: block; height: 9px; width: var(--w, 100%);
  background: linear-gradient(90deg, rgba(243, 244, 251, .05), rgba(243, 244, 251, .11), rgba(243, 244, 251, .05));
  background-size: 200% 100%;
  animation: shimmer 4.5s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Media frame with registration marks ---------- */
.frame {
  position: relative; display: block; overflow: hidden;
  max-width: 100%;
  background: #05071A;
  border: 1px solid var(--line-2);
  isolation: isolate;
}
.frame > canvas, .frame > img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  translate: 0 var(--py, 0px);
  scale: var(--zoom, 1.001);
  transition: scale 1.4s var(--ease), filter 1s var(--ease);
}
.frame[data-parallax] { --zoom: 1.12; }
.frame::after {
  content: ""; position: absolute; inset: 14px; pointer-events: none; z-index: 2;
  --c: var(--paper);
  background:
    linear-gradient(var(--c), var(--c)) top left / 18px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) top left / 2px 18px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 18px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 2px 18px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 18px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 2px 18px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / 18px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / 2px 18px no-repeat;
  opacity: .55;
  transition: inset .7s var(--ease), opacity .5s;
}
.ph-tag {
  position: absolute; left: 0; bottom: 0; z-index: 3;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink); background: var(--paper);
}
.ph-tag i { background: var(--ink); }
.cap {
  display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; padding-top: 10px;
  border-top: 1px solid var(--line-2);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--muted);
}
.cap > span:first-child { color: var(--paper); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; flex: none; }
.cap > span:last-child { text-align: right; min-width: 0; }

/* ---------- Buttons ---------- */
.btn {
  position: relative; isolation: isolate; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: space-between; gap: 28px;
  min-height: 60px; padding: 0 22px 0 24px;
  font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1;
  border: 2px solid transparent; cursor: pointer;
  transition: color .45s var(--ease), border-color .45s var(--ease);

.btn svg { transition: transform .45s var(--ease); flex: none; }
.btn:hover svg { transform: translateX(6px); }

  content: ""; position: absolute; inset: -2px; z-index: -1;

  border: 2px dashed var(--line-3); color: var(--muted); cursor: default; justify-content: flex-start; gap: 12px;

/* ---------- Reveal ---------- */
[data-reveal] { transition: opacity 1s var(--ease), transform 1s var(--ease), clip-path 1.2s var(--ease); transition-delay: calc(var(--i, 0) * 110ms); }

.display[data-reveal] { clip-path: inset(-10% -5% -10% -5%); }

@media (prefers-reduced-motion: reduce) {

  <style>
/* =========================================================== NAVIGATION */
.nav { position: fixed; inset: 0 0 auto; z-index: 50; padding-top: env(safe-area-inset-top, 0px); }
.nav::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: rgba(6, 8, 20, .72);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--line-2);
  opacity: 0; transition: opacity .5s var(--ease);
}
.nav.is-scrolled::before { opacity: 1; }
.nav__inner { height: var(--nav-h); display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { position: relative; z-index: 2; display: inline-flex; align-items: center; gap: 10px; line-height: 1; white-space: nowrap; }
.logo__a { font-family: var(--f-display); font-size: 27px; font-weight: 700; letter-spacing: -.03em; color: var(--paper); }
.logo__slash {
  display: inline-block; width: 3px; height: 26px; background: var(--pink); font-size: 0;
  transform: skewX(-18deg); transition: transform .6s var(--ease);
}
.logo:hover .logo__slash { transform: skewX(18deg); }
.logo__b { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .16em; color: var(--paper); }
.nav__links { display: flex; gap: 2px; list-style: none; margin: 0; padding: 0; }
.nav__links a {
  position: relative; display: block; padding: 10px 14px;
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  transition: color .3s var(--ease), background .3s var(--ease);
}
.nav__links a:hover { color: var(--ink); background: var(--paper); }
.nav__links a.is-active { color: var(--ink); background: var(--blue); }
.nav__toggle { display: none; }

@media (max-width: 820px) {
  .nav__toggle {
    position: relative; z-index: 2;
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
    width: 52px; height: 44px; padding: 0; cursor: pointer;
    background: var(--blue); border: 0;
  }
  .nav__toggle span:not(.sr) { width: 22px; height: 2px; background: var(--ink); transition: transform .5s var(--ease); }
  .nav.is-open .nav__toggle span:nth-child(1) { transform: translateY(4.5px) rotate(45deg); }
  .nav.is-open .nav__toggle span:nth-child(2) { transform: translateY(-4.5px) rotate(-45deg); }
  .nav__links {
    position: fixed; inset: 0; z-index: 1;
    flex-direction: column; justify-content: flex-end; gap: 0;
    padding: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 24px) max(var(--gutter), env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(var(--gutter), env(safe-area-inset-left, 0px));

    transition: clip-path .7s var(--ease-io), visibility .7s;

  .nav.is-open .nav__links { clip-path: inset(0 0 0 0); visibility: visible; }
  .nav__links li { border-top: 1px solid var(--line-2); }
  .nav__links a {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 0 8px; background: none !important;
    font-family: var(--f-display); font-size: clamp(3rem, 15vw, 5rem); font-weight: 600; letter-spacing: -.04em; line-height: .98;
    color: var(--paper); opacity: 0; transform: translateY(30px);

  .nav__links a::after {

  .nav__links a.is-active { color: var(--blue) !important; }
  .nav.is-open .nav__links a { opacity: 1; transform: none; }
}

/* ================================================================= HERO */
.hero {
  position: relative; isolation: isolate; overflow: hidden;
  min-height: min(100svh, 1040px);
  display: flex; flex-direction: column;
  padding-top: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
}
.hero__wave {
  position: absolute; inset: -20% -10%; z-index: -1; pointer-events: none; opacity: .8;
  background: repeating-linear-gradient(115deg, transparent 0 120px, rgba(91, 140, 255, .03) 160px, transparent 220px);
  -webkit-mask-image: radial-gradient(55% 60% at 70% 40%, #000, transparent 75%);
  mask-image: radial-gradient(55% 60% at 70% 40%, #000, transparent 75%);

@keyframes wave { to { transform: translate3d(220px, 0, 0); } }

.hero__eyebrow { animation: fadeUp .9s var(--ease) .1s both; }
.hero__copy { position: relative; z-index: 2; margin-top: auto; padding-bottom: clamp(28px, 4vw, 48px); }
.hero__title {
  margin: 0 0 clamp(24px, 3vw, 40px);
  font-family: var(--f-display); font-weight: 650;
  font-size: clamp(3rem, 10.6vw, 11rem);
  line-height: .9; letter-spacing: -.048em;
}
.hero__title .line { display: block; overflow: hidden; padding-block: .04em .2em; margin-bottom: -.2em; }
.hero__title .line:nth-child(2) { padding-left: clamp(0px, 9vw, 9rem); }
.hero__title .line__in { display: inline-block; animation: rise 1.25s var(--ease) both; animation-delay: calc(.15s + var(--d) * .12s); }
.hero__title em { -webkit-text-stroke-width: clamp(1.5px, .22vw, 3px); }
@keyframes rise { from { transform: translate3d(0, 102%, 0) skewY(4deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translate3d(0, 16px, 0); } }
.hero__row {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 24px; align-items: end;
  padding-top: clamp(20px, 2.4vw, 28px); border-top: 2px solid var(--paper);
  animation: fadeUp 1.1s var(--ease) .6s both;
}
.hero__lead { grid-column: 1 / span 5; max-width: 42ch; font-size: var(--t-lg); font-weight: 500; line-height: 1.4; color: var(--paper); }
.hero__ctas { grid-column: 8 / -1; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* Eyepiece */
.eyepiece {
  position: absolute; z-index: 0; margin: 0;
  top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 64px);
  right: max(calc(var(--gutter) - 2vw), env(safe-area-inset-right, 0px));
  width: min(52vw, 760px); aspect-ratio: 1; max-width: none;
  translate: 0 var(--py, 0px);
  animation: lensIn 1.8s var(--ease) .05s both;
}
@keyframes lensIn { from { opacity: 0; transform: scale(.9) rotate(-8deg); } }
.eyepiece__view {
  position: absolute; inset: 7%; border-radius: 50%; overflow: hidden; background: #04060F;
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 18px var(--ink), 0 0 0 19px var(--line-2);
}
.eyepiece__view::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  box-shadow: inset 0 0 60px 24px rgba(4, 6, 15, .92);

.eyepiece__canvas, .eyepiece__img { position: absolute; inset: 0; width: 100%; height: 100%; }
.eyepiece__img { object-fit: cover; }
.eyepiece__reticle { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--blue-soft); pointer-events: none; overflow: visible; }
.eyepiece__ring { transform-origin: 200px 200px; animation: spin 140s linear infinite; }
.eyepiece__nums text { font-family: var(--f-mono); font-size: 7px; }
@keyframes spin { to { transform: rotate(360deg); } }
.hud {
  position: absolute; z-index: 1; padding: 6px 9px; line-height: 1.5;
  font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
  color: var(--paper); background: rgba(6, 8, 20, .8); border: 1px solid var(--line-2);
}
.hud b { font-weight: 600; color: var(--blue); }
.hud i { font-family: var(--f-sans); font-size: 13px; letter-spacing: 0; text-transform: none; }
.hud--tl { top: 4%; left: 4%; }
.hud--tr { top: 4%; right: 4%; background: var(--pink); color: var(--ink); border-color: var(--pink); }
.hud--bl { top: 46%; left: -2%; }
.eyepiece__note {
  position: absolute; top: 10%; right: -1%; writing-mode: vertical-rl;
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
}

/* Ticker band */
.ticker {
  position: relative; z-index: 3; display: flex; align-items: stretch; overflow: hidden;
  background: var(--pink); color: var(--ink); border-block: 2px solid var(--ink);
}
.ticker__title {
  position: relative; z-index: 1; flex: none; display: flex; align-items: center; max-width: 30%;
  padding: 0 18px 0 max(var(--gutter), env(safe-area-inset-left, 0px));
  background: var(--ink); color: var(--pink);
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.3;
}
.ticker__title:empty { display: none; }
.ticker__viewport { flex: 1; min-width: 0; overflow: hidden; }
.ticker__track {
  display: flex; align-items: baseline; width: max-content; gap: 26px; padding: 14px 0 12px 26px;
  white-space: nowrap; animation: ticker 48s linear infinite;
}
.ticker:hover .ticker__track { animation-play-state: paused; }
.ticker__item { display: inline-flex; align-items: baseline; gap: 10px; }
.ticker__item em { font-family: var(--f-display); font-style: italic; font-weight: 600; font-size: clamp(1.25rem, 2.2vw, 2rem); letter-spacing: -.02em; line-height: 1; }
.ticker__item b { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.ticker__track > i { font-style: normal; font-family: var(--f-mono); font-weight: 600; font-size: 1rem; opacity: .6; }
@keyframes ticker { to { transform: translate3d(-50%, 0, 0); } }
@media (max-width: 680px) { .ticker__title { display: none; } }

@media (max-width: 1100px) {
  .hero__lead { grid-column: 1 / span 7; }
  .hero__ctas { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (max-width: 820px) {
  .hero { min-height: 100svh; }
  .hero::after {
    content: ""; position: absolute; inset: auto 0 0; height: 70%; z-index: 1; pointer-events: none;
    background: linear-gradient(to top, var(--ink) 45%, rgba(6, 8, 20, .7) 75%, transparent);
  }
  .eyepiece { width: 118vw; top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 6vw); right: -36vw; }
  .hud--tl, .eyepiece__note { display: none; }
  .hud--tr { top: 10%; right: auto; left: 14%; }
  .hud--bl { top: 52%; left: 4%; }
  .hero__title { font-size: clamp(2.8rem, 13.4vw, 5.8rem); }
  .hero__title .line:nth-child(2) { padding-left: 0; }
  .hero__lead { grid-column: 1 / -1; font-size: 1.1rem; }
}
@media (max-width: 480px) {
  .hero__ctas .btn { flex: 1 1 100%; }
}

/* ======================================================== SECTION HEADS */
.sec-head {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 24px; align-items: end;
  margin-bottom: clamp(48px, 6vw, 88px);
}
.sec-head__title { grid-column: 1 / span 9; display: grid; gap: 24px; }
.sec-head__aside {
  grid-column: 10 / span 3; max-width: 32ch; padding-bottom: .4em;
  font-size: var(--t-sm); font-weight: 500; color: var(--muted);
}
@media (max-width: 820px) {
  .sec-head__title, .sec-head__aside { grid-column: 1 / -1; }
}

/* ================================================================ INTRO */
.intro__head { display: grid; gap: 28px; }
.intro__head .display { max-width: 12ch; font-size: clamp(3rem, 8.8vw, 9.6rem); }
.intro__body {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 32px;
  margin-top: clamp(48px, 6vw, 88px);
}
.intro__lede { grid-column: 4 / span 6; font-size: clamp(1.4rem, 2.4vw, 2.1rem); font-weight: 500; line-height: 1.25; letter-spacing: -.015em; }
.intro__text { grid-column: 10 / span 3; color: var(--muted); font-size: var(--t-sm); padding-top: .4em; }
.intro__lede p + p, .intro__text p + p { margin-top: 1em; }

.scale { margin: clamp(80px, 10vw, 140px) 0; }
.scale__head {
  display: flex; justify-content: space-between; gap: 16px;
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.scale__track { position: relative; height: 120px; margin-top: 28px; margin-bottom: 44px; border-bottom: 2px solid var(--paper); }
.scale__zone {
  position: absolute; top: 0; bottom: 0; left: var(--limit); right: 0;
  background: repeating-linear-gradient(-45deg, rgba(91, 140, 255, .16) 0 2px, transparent 2px 10px);
  transform-origin: left; transition: transform 1.6s var(--ease) .3s;
}
.scale.is-pre .scale__zone { transform: scaleX(0); }
.scale__zlabel {
  position: absolute; top: 16px; max-width: calc(var(--limit) - 32px);
  font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(1rem, 1.8vw, 1.6rem); line-height: 1.05; color: var(--muted);
}
.scale__zlabel--l { left: 0; }
.scale__zlabel--r { left: calc(var(--limit) + 16px); color: var(--blue); }
.scale__limit { position: absolute; left: var(--limit); top: -16px; bottom: -2px; width: 3px; margin-left: -1px; background: var(--pink); }
.scale__limit b {
  position: absolute; bottom: 12px; right: 9px; white-space: nowrap; padding: 6px 9px;
  font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; color: var(--ink); background: var(--pink);
}
.tick { position: absolute; bottom: 0; width: 1px; height: 12px; background: var(--line-3); }
.tick--major { width: 2px; height: 34px; background: var(--paper); }
.tick--major b {
  position: absolute; top: calc(100% + 14px); left: 0; transform: translateX(-50%); white-space: nowrap;
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--paper); font-variant-numeric: tabular-nums;
}
.tick--first b { transform: none; }
.tick--last b { transform: translateX(-100%); }

.intro__plates { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 48px; align-items: end; }
.plate { margin: 0; min-width: 0; }
.plate--a { grid-column: 1 / span 8; }
.plate--a .frame { aspect-ratio: 16 / 10; }
.plate--b { grid-column: 9 / span 4; transform: translateY(22%); }
.plate--b .frame { aspect-ratio: 3 / 4; border-color: var(--blue); border-width: 2px; }
.plate--b.is-pre { transform: translate3d(0, calc(22% + 40px), 0); }

@media (max-width: 900px) {
  .intro__lede { grid-column: 1 / span 10; }
  .intro__text { grid-column: 1 / span 8; }
  .plate--a { grid-column: 1 / -1; }
  .plate--b { grid-column: 6 / -1; transform: none; margin-top: -20%; position: relative; }
  .plate--b.is-pre { transform: translate3d(0, 40px, 0); }
}
@media (max-width: 560px) {
  .intro__lede, .intro__text { grid-column: 1 / -1; }
  .plate--b { grid-column: 4 / -1; }
  .scale__track { height: 136px; }
  .scale__limit b { right: auto; left: 8px; bottom: auto; top: 0; }
  .scale__zlabel { top: 44px; font-size: .95rem; }
}

/* ============================================================ LIFE CYCLE */
.lifecycle { background: var(--navy); border-top: 2px solid var(--blue); }
.player { position: relative; padding-top: 30px; }
.player__label {
  position: absolute; top: 0; left: 0; z-index: 2; padding: 8px 12px 7px;
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  background: var(--pink); color: var(--ink);
}
.player__frame {
  position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 100%; overflow: hidden;
  background: #03040C; border: 2px solid var(--blue);
}
.player__media, .player__media > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.player__media img, .player__media video { object-fit: cover; }
.player__media iframe { border: 0; }
.player[data-state="playing"] .player__media video { object-fit: contain; background: #000; }
.player__poster { transition: transform 2s var(--ease), filter 1s; }
.player[data-state="empty"] .player__poster { filter: saturate(.7) brightness(.6); animation: breathe 18s var(--ease-io) infinite alternate; }
@keyframes breathe { from { transform: scale(1.02); } to { transform: scale(1.1) translate3d(-1%, 1%, 0); } }
.player__shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, rgba(3, 4, 12, .9), transparent 45%), linear-gradient(to bottom, rgba(3, 4, 12, .6), transparent 25%);
}
.player__hud {
  position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; gap: 16px;
  padding: clamp(14px, 2vw, 24px) clamp(16px, 2.4vw, 28px);
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--paper);
}
.player__bar { position: absolute; left: clamp(16px, 2.4vw, 28px); right: clamp(16px, 2.4vw, 28px); bottom: clamp(16px, 2.2vw, 26px); height: 2px; background: var(--line-2); }
.player__bar span { position: absolute; left: 0; top: -4px; width: 10px; height: 10px; background: var(--blue); }
.player[data-state="playing"] .player__shade,
.player[data-state="playing"] .player__hud,
.player[data-state="playing"] .player__bar,
.player[data-state="playing"] .player__play { display: none; }

.player__empty {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2vw, 24px);
  text-align: center; padding: 24px;
}
.empty__ring {
  position: relative; display: grid; place-items: center;
  width: clamp(56px, 8vw, 104px); aspect-ratio: 1; border-radius: 50%;
  border: 2px solid var(--paper); color: var(--paper);
}
.empty__ring svg { width: 34%; height: 34%; margin-left: 6%; }
.empty__orbit { position: absolute; inset: -10px; border-radius: 50%; border: 2px dashed var(--blue); animation: spin 22s linear infinite; }
.empty__title {
  font-family: var(--f-display); font-weight: 650; font-size: clamp(2rem, 5.6vw, 5.6rem); line-height: .92; letter-spacing: -.04em; max-width: 12ch;
}
.empty__sub {
  padding: 6px 10px; background: var(--paper); color: var(--ink);
  font-family: var(--f-mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
}

.player__play {
  position: absolute; left: 50%; top: 50%; translate: -50% -50%;
  display: grid; place-items: center;
  width: clamp(76px, 10vw, 136px); aspect-ratio: 1; border: 0; cursor: pointer;
  background: var(--blue); color: var(--ink);
  transition: transform .5s var(--ease), background .4s;
}
.player__play svg { width: 34%; height: 34%; margin-left: 6%; }
.player__play:hover { transform: scale(1.08) rotate(-4deg); background: var(--paper); }
.player[data-state="ready"]:hover .player__poster { transform: scale(1.04); }

.player__info {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; row-gap: 24px; align-items: start;
  margin-top: clamp(28px, 4vw, 48px);
}
.player__title { grid-column: 1 / span 5; margin: 0; font-family: var(--f-display); font-size: clamp(1.9rem, 3.4vw, 3rem); font-weight: 650; letter-spacing: -.035em; line-height: 1; }
.player__title .ph-inline { color: var(--dim); border-bottom-width: 2px; }
.player__desc { grid-column: 6 / span 4; color: var(--muted); }
.player__actions { grid-column: 10 / span 3; display: flex; justify-content: flex-end; }
@media (max-width: 900px) {
  .player__title, .player__desc { grid-column: 1 / -1; }
  .player__actions { grid-column: 1 / -1; justify-content: flex-start; }
}
@media (max-width: 560px) {
  .player__hud span:last-child { display: none; }
  .empty__sub, .empty__ring { display: none; }
  .player__actions .btn { width: 100%; }
}

/* Stages */
.stages { margin-top: clamp(120px, 14vw, 200px); }
.sec-head--sub .display { font-size: clamp(2.6rem, 6vw, 6.2rem); }
.stages__track {
  position: relative; list-style: none; margin: 0; padding: 0;
  display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 28px;
}
.stage { position: relative; min-width: 0; outline: none; cursor: default; }
.stage__big {
  display: block; margin-bottom: 14px;
  font-family: var(--f-display); font-weight: 600; font-size: clamp(4rem, 7.6vw, 8rem); line-height: .8; letter-spacing: -.05em; font-variant-numeric: lining-nums;
  color: transparent; -webkit-text-stroke: 1.5px var(--line-3);
  transition: color .5s var(--ease), -webkit-text-stroke-color .5s;
}
.stage.is-passed .stage__big { -webkit-text-stroke-color: var(--blue); }
.stage.is-active .stage__big { color: var(--pink); -webkit-text-stroke-color: var(--pink); }
.stage__marker { position: relative; display: flex; align-items: center; gap: 12px; height: 16px; margin-bottom: 20px; }
.stage__marker::after {
  content: ""; position: absolute; left: 14px; right: -28px; top: 50%; height: 2px; margin-top: -1px; background: var(--line-2);
}
.stage__marker::before {
  content: ""; position: absolute; left: 14px; right: -28px; top: 50%; height: 2px; margin-top: -1px; z-index: 1;
  background: var(--blue); transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease);
}
.stage:last-child .stage__marker::after {
  background: repeating-linear-gradient(90deg, var(--line-3) 0 6px, transparent 6px 12px); right: 0;
}
.stage:last-child .stage__marker::before { display: none; }
.stage.is-passed .stage__marker::before { transform: scaleX(1); }
.stage__dot {
  position: relative; z-index: 2; flex: none; width: 14px; height: 14px;
  border: 2px solid var(--paper); background: var(--navy);
  transition: background .4s var(--ease), border-color .4s, transform .5s var(--ease);
}
.stage__num {
  position: relative; z-index: 2; padding-right: 10px; background: var(--navy);
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.stage.is-passed .stage__dot { background: var(--blue); border-color: var(--blue); }
.stage.is-active .stage__dot { background: var(--blue); border-color: var(--blue); transform: rotate(45deg) scale(1.15); }
.stage.is-active .stage__num { color: var(--paper); }
.frame--stage { aspect-ratio: 4 / 5; transition: border-color .5s var(--ease); }
.stage.is-active .frame--stage { border-color: var(--blue); }
.stage.is-active .frame--stage > canvas, .stage.is-active .frame--stage > img { --zoom: 1.07; }
.stage.is-active .frame::after { inset: 22px; opacity: 1; }
.stage:focus-visible .frame--stage { outline: 2px solid var(--blue); outline-offset: 4px; }
.stage__host { margin-top: 18px; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
.stage__title { margin: 20px 0 8px; font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.stage__host + .stage__title { margin-top: 6px; }
.stage__desc { font-size: var(--t-sm); color: var(--muted); }
.stage__desc .ph-block { gap: 10px; }
.stages__foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 48px; padding-top: 22px; border-top: 2px solid var(--paper); }
.stages__return {
  display: inline-flex; align-items: center; gap: 10px; margin-left: auto;
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--paper);
}
.stages__return svg { width: 20px; height: 20px; color: var(--blue); }
.stages__dots { display: none; gap: 6px; }
.stages__dots span { width: 14px; height: 4px; background: var(--line-2); transition: background .4s, width .4s var(--ease); }
.stages__dots span.is-on { background: var(--blue); width: 36px; }

@media (max-width: 900px) {
  .stages__track {
    display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
    margin-inline: calc(-1 * max(var(--gutter), env(safe-area-inset-left, 0px)));
    padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px));
    scroll-padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px));
    scrollbar-width: none; padding-bottom: 8px;
  }
  .stages__track::-webkit-scrollbar { display: none; }
  .stage { flex: 0 0 min(76vw, 340px); scroll-snap-align: start; }
  .stage__marker::after, .stage__marker::before { right: -20px; }
  .stages__dots { display: flex; }
}

/* =============================================================== DOSSIER */
.dossier__layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: clamp(40px, 6vw, 112px); align-items: start; }
.dossier__index { position: sticky; top: calc(var(--nav-h) + env(safe-area-inset-top, 0px) + 32px); }
.dossier__index ol { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--paper); }
.dossier__index a {
  display: flex; gap: 14px; padding: 10px 10px; border-bottom: 1px solid var(--line);
  font-size: var(--t-sm); font-weight: 500; color: var(--muted); transition: color .3s, background .3s;
}
.dossier__index a span { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim); padding-top: 3px; font-variant-numeric: tabular-nums; }
.dossier__index a:hover { color: var(--paper); background: rgba(243, 244, 251, .04); }
.dossier__index a.is-active { color: var(--ink); background: var(--blue); }
.dossier__index a.is-active span { color: var(--ink); }

.entry { padding-block: clamp(48px, 6vw, 80px); border-top: 1px solid var(--line-2); min-width: 0; }
.entry:first-child { border-top: 0; padding-top: 0; }
.entry__head { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
.entry__num { font-family: var(--f-display); font-weight: 650; font-size: 2.4rem; line-height: .8; letter-spacing: -.04em; color: var(--blue); font-variant-numeric: lining-nums; }
.entry__label { margin: 0; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--paper); }
.entry__lead { max-width: 60ch; font-size: var(--t-lg); font-weight: 500; line-height: 1.5; margin-top: 36px; }
.entry__text { max-width: 64ch; }
.entry__text p + p, .entry__lead p + p { margin-top: 1em; }

.specimen { display: grid; gap: 10px; }
.specimen__name { font-family: var(--f-display); font-weight: 650; font-size: clamp(3.2rem, 8vw, 8.2rem); line-height: .9; letter-spacing: -.045em; overflow-wrap: anywhere; }
.specimen__name--empty { color: transparent; -webkit-text-stroke: 1.5px var(--line-3); }
.specimen__sci { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: clamp(1.4rem, 2.6vw, 2.2rem); color: var(--pink-soft); line-height: 1.2; }
.specimen__sci--empty { color: var(--dim); }
.specimen__group {
  justify-self: start; margin-top: 10px; padding: 7px 11px; background: var(--paper); color: var(--ink);
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
}

.taxonomy { list-style: none; margin: 0; padding: 0; max-width: 760px; border-top: 2px solid var(--paper); }
.taxon {
  position: relative; display: grid; grid-template-columns: 130px minmax(0, 1fr); align-items: baseline; gap: 20px;
  padding: 16px 0 16px calc(var(--i) * 24px);
  border-bottom: 1px solid var(--line-2);
  transition: background .3s;
}
.taxon::before {
  content: ""; position: absolute; left: calc(var(--i) * 24px - 15px); top: 0; width: 9px; height: 55%;
  border-left: 2px solid var(--blue); border-bottom: 2px solid var(--blue);
}
.taxon:first-child::before { display: none; }
.taxon:hover { background: rgba(91, 140, 255, .06); }
.taxon__rank { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.taxon__value { font-size: 1.3rem; font-weight: 700; letter-spacing: -.015em; min-width: 0; overflow-wrap: anywhere; }
.taxon__value.is-italic { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 1.5rem; color: var(--pink-soft); }
.taxon__value.is-empty { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; font-style: normal; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

.hosts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }
.hosts__col { padding-top: 18px; border-top: 2px solid var(--paper); }
.hosts + .entry__text { margin-top: 32px; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 10px 16px; border: 2px solid var(--paper); font-size: var(--t-sm); font-weight: 700; transition: background .3s, color .3s; }
.chip:hover { background: var(--paper); color: var(--ink); }
.chip--empty { border-style: dashed; border-color: var(--line-3); color: var(--dim); font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.chip--empty:hover { background: none; color: var(--dim); }

.morph { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(28px, 4vw, 56px); align-items: start; }
.morph__fig { margin: 0; }
.frame--morph { aspect-ratio: 4 / 5; }
.morph__text { display: grid; gap: 32px; }
.measure { margin: 0; border-top: 2px solid var(--paper); }
.measure div { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line-2); }
.measure dt { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.measure dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.measure--empty dd { color: var(--dim); }

/* Transmission: solid blue slab */
.callout {
  position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); align-items: start;
  padding: clamp(28px, 4.5vw, 60px);
  background: var(--blue); color: var(--ink);
}

@keyframes chRise { from { transform: translate3d(0, 115%, 0) rotate(8deg); } }
.has-split .empty__title .ch { animation: chFlicker 6s steps(1) infinite; animation-delay: calc(var(--ci) * 90ms); }

/* ---------- Image wipe reveal (frames inside revealed blocks) ---------- */
.frame::before {
  content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background: var(--blue); transform: scaleY(0); transform-origin: top;
  transition: transform 1.1s cubic-bezier(.76, 0, .18, 1) .15s;
}
.is-pre .frame::before { transform: scaleY(1); transform-origin: bottom; transition: none; }
.is-pre .frame > canvas, .is-pre .frame > img { scale: 1.35; transition: none; }

/* ---------- Nav additions ---------- */
.nav__progress {
  position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; z-index: 1;
  background: var(--blue); transform: scaleX(var(--progress, 0)); transform-origin: left;
}
.nav__count {
  display: none; align-items: baseline; gap: 6px; margin-right: auto; margin-left: clamp(24px, 4vw, 64px);
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.nav__count b { font-family: var(--f-display); font-size: 22px; font-weight: 400; letter-spacing: 0; color: var(--paper); }
.nav__count i { font-style: normal; color: var(--blue); margin-left: 8px; }
@media (min-width: 1101px) { .nav__count { display: inline-flex; } }

/* ---------- Magnetic elements ---------- */
.magnetic { translate: var(--mx, 0px) var(--my, 0px); transition: translate .6s var(--ease), color .45s var(--ease), border-color .45s var(--ease), background .3s var(--ease), transform .5s var(--ease); }
.player__play.magnetic { translate: calc(-50% + var(--mx, 0px)) calc(-50% + var(--my, 0px)); }

/* ---------- Lens badge (follows the pointer over specimens; system cursor stays) ---------- */
.lens-badge {
  position: fixed; left: 0; top: 0; z-index: 180; pointer-events: none;
  margin: 18px 0 0 18px; padding: 8px 12px 7px;
  background: var(--pink); color: var(--ink);
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  opacity: 0; scale: .7; transition: opacity .25s var(--ease), scale .35s var(--ease);
}
.lens-badge.is-on { opacity: 1; scale: 1; }

/* ---------- Pinned horizontal stages (desktop) ---------- */
.stages.is-pinned .stages__sticky {
  position: sticky; top: calc(var(--nav-h) + env(safe-area-inset-top, 0px));
  min-height: calc(100vh - var(--nav-h) - env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; justify-content: center; padding-block: 24px;
}
.stages.is-pinned .stages__track { display: flex; gap: 28px; will-change: transform; }
.stages.is-pinned .stage { flex: 0 0 clamp(320px, 30vw, 480px); }
.stages.is-pinned .frame--stage { aspect-ratio: auto; height: min(34vh, 24vw); }
.stages.is-pinned .stages__foot { position: relative; }
.stages.is-pinned .stages__foot::before {
  content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 2px; background: var(--blue);
  transform: scaleX(var(--pin, 0)); transform-origin: left;
}
.stages.is-pinned .stages__dots { display: flex; }

@media (prefers-reduced-motion: reduce) {
  .loader { display: none; }

}

/* Shared helpers. Everything hangs off one global: window.VP */
window.VP = window.VP || { render: {} };

(function (VP) {
  "use strict";

  VP.esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  VP.has = function (v) {
    if (Array.isArray(v)) return v.some(VP.has);
    if (v && typeof v === "object") return Object.keys(v).some(function (k) { return VP.has(v[k]); });
    return v !== undefined && v !== null && String(v).trim() !== "";
  };

  VP.pad = function (n) { return String(n).padStart(2, "0"); };

  /* "*word*" -> <em>word</em> (the italic serif accent) */
  VP.accent = function (s) {
    return VP.esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");
  };

  /* Inline text or a dashed placeholder label */
  VP.text = function (v, label) {
    if (VP.has(v)) return VP.esc(v);
    return '<span class="ph-inline">' + VP.esc(label) + "</span>";
  };

  /* Paragraph(s) or a skeleton block that reads as "awaiting content" */
  VP.para = function (v, label, lines) {
    if (VP.has(v)) {
      var list = Array.isArray(v) ? v : [v];
      return list.filter(VP.has).map(function (p) { return "<p>" + VP.esc(p) + "</p>"; }).join("");
    }
    var n = lines || 3, bars = "";
    for (var i = 0; i < n; i++) bars += '<span class="ph-line" style="--w:' + (i === n - 1 ? 58 : 100 - i * 6) + '%"></span>';
    return '<div class="ph-block"><span class="ph-label"><i></i>' + VP.esc(label) + "</span>" + bars + "</div>";
  };

  /* An image, or a generated placeholder plate */
  VP.media = function (src, alt, seed, variant, tag) {
    if (VP.has(src)) {
      return '<img src="' + VP.esc(src) + '" alt="' + VP.esc(alt || "") + '" loading="lazy" decoding="async">';
    }
    return (
      '<canvas class="ph-art" data-seed="' + (seed || 1) + '" data-variant="' + (variant || "field") + '" aria-hidden="true"></canvas>' +
      '<span class="ph-tag"><i></i>' + VP.esc(tag || "Image pending") + "</span>"
    );
  };

  /* Institution logos lockup */
  VP.logos = function (C, cls, withNames) {
    var A = C.affiliation || {};
    var list = (A.logos || []).filter(function (l) { return VP.has(l.src); });
    if (!list.length) return "";
    var imgs = list.map(function (l) {
      return '<img class="logos__img' + (l.mono ? " is-mono" : "") + '" src="' + VP.esc(l.src) + '" alt="' + VP.esc(l.alt || "") + '" decoding="async">';
    }).join('<span class="logos__sep" aria-hidden="true"></span>');
    var names = withNames && (VP.has(A.name) || VP.has(A.institution))
      ? '<span class="logos__names"><b>' + VP.esc(A.name || "") + "</b><span>" + VP.esc(A.institution || "") + "</span></span>"
      : "";
    return '<div class="logos ' + (cls || "") + '">' + '<span class="logos__marks">' + imgs + "</span>" + names + "</div>";
  };

  VP.arrow =
    '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M3 9h11.5M10 4.5 14.5 9 10 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* Deterministic random, so placeholders look the same on every load */
  VP.rand = function (seed) {
    var a = (seed * 2654435761) >>> 0 || 1;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  VP.reducedMotion = function () {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  };

  /* Accepts mp4/webm paths, YouTube and Vimeo links */
  VP.embedUrl = function (url) {
    var yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
    if (yt) return "https://www.youtube-nocookie.com/embed/" + yt[1] + "?autoplay=1&rel=0";
    var vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (vm) return "https://player.vimeo.com/video/" + vm[1] + "?autoplay=1";
    return null;
  };
})(window.VP);

/* Section reveals and scroll parallax. Everything is visible without JS;
   only content below the fold is prepared for a reveal. */
(function (VP) {
  "use strict";

  VP.initReveal = function () {
    var els = [].slice.call(document.querySelectorAll("[data-reveal]"));
    if (VP.reducedMotion() || !("IntersectionObserver" in window)) return;
    var vh = window.innerHeight;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.remove("is-pre");
        en.target.classList.add("is-in");
        io.unobserve(en.target);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
    els.forEach(function (el) {
      if (el.getBoundingClientRect().top > vh * 0.92) {
        el.classList.add("is-pre");
        io.observe(el);
      } else {
        el.classList.add("is-in");
      }
    });
    // Safety net: never leave content hidden (e.g. when jumping via anchors)
    window.addEventListener("hashchange", function () {
      setTimeout(function () {
        els.forEach(function (el) {
          var r = el.getBoundingClientRect();
          if (r.top < window.innerHeight && r.bottom > 0) { el.classList.remove("is-pre"); el.classList.add("is-in"); }
        });
      }, 700);
    });
  };

  VP.initParallax = function () {
    if (VP.reducedMotion()) return;
    var els = [].slice.call(document.querySelectorAll("[data-parallax]"));
    if (!els.length) return;
    var ticking = false;
    function update() {
      ticking = false;
      var vh = window.innerHeight;
      for (var i = 0; i < els.length; i++) {
        var el = els[i], r = el.getBoundingClientRect();
        if (r.bottom < -200 || r.top > vh + 200) continue;
        var f = parseFloat(el.dataset.parallax) || 0;
        var delta = (r.top + r.height / 2 - vh / 2) * f;
        el.style.setProperty("--py", (-delta).toFixed(1) + "px");
      }
    }
    window.addEventListener("scroll", function () {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    window.addEventListener("resize", update);
    update();
  };
})(window.VP);

        }
        el.textContent = out;
        if (p < 1) requestAnimationFrame(step); else el.textContent = final;
      })(start);
    }
    var so = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) { scramble(en.target); so.unobserve(en.target); } });
    }, { threshold: 1 });
    document.querySelectorAll(".eyebrow, .player__label").forEach(function (el) {
      if (el.children.length === 0) so.observe(el);
    });
  });

  /* ------------------------------- lens badge (system cursor stays visible) */
  safe("lens badge", function () {
    if (!fine || reduce) return;
    var badge = document.createElement("div");
    badge.className = "lens-badge";
    badge.setAttribute("aria-hidden", "true");
    document.body.appendChild(badge);
    var mx = 0, my = 0, bx = 0, by = 0, active = false, raf = 0;
    function follow() {
      bx += (mx - bx) * 0.2; by += (my - by) * 0.2;
      badge.style.transform = "translate3d(" + bx.toFixed(1) + "px," + by.toFixed(1) + "px,0)";
      if (active || Math.abs(mx - bx) > 0.5) raf = requestAnimationFrame(follow); else raf = 0;
    }
    window.addEventListener("pointermove", function (e) {
      mx = e.clientX; my = e.clientY;
      if (!raf) raf = requestAnimationFrame(follow);
    }, { passive: true });
    document.addEventListener("pointerover", function (e) {
      var t = e.target;
      var mode = t.closest(".g-item__btn") ? "Examine" : t.closest(".plate .frame, .stage .frame, .morph__fig .frame") ? "Specimen" : t.closest(".eyepiece") ? "Focus" : "";
      active = !!mode;
      if (mode) { badge.textContent = mode; if (!badge.classList.contains("is-on")) { bx = mx; by = my; } }
      badge.classList.toggle("is-on", active);
      if (!raf) raf = requestAnimationFrame(follow);
    });
  });

  /* ------------------------------------------------------------ magnetic */
  safe("magnetic", function () {
    if (!fine || reduce) return;
    document.querySelectorAll(".btn, .nav__links a, .lightbox__ctrl button").forEach(function (b) {
      b.classList.add("magnetic");
      b.addEventListener("pointermove", function (e) {
        var r = b.getBoundingClientRect();
        b.style.setProperty("--mx", ((e.clientX - r.left - r.width / 2) * 0.2).toFixed(1) + "px");
        b.style.setProperty("--my", ((e.clientY - r.top - r.height / 2) * 0.28).toFixed(1) + "px");
      });
      b.addEventListener("pointerleave", function () { b.style.setProperty("--mx", "0px"); b.style.setProperty("--my", "0px"); });
    });
  });

  /* ------------------------------------------------------ pinned stages */
  var pin = safe("pinned stages", function () {
    var stages = document.querySelector(".stages");
    if (!stages || reduce || !window.matchMedia) return null;
    var track = stages.querySelector(".stages__track"), foot = stages.querySelector(".stages__foot");
    var n = track.children.length;
    if (n < 4) return null;
    var wrapEl = document.createElement("div"), sticky = document.createElement("div");
    wrapEl.className = "stages__pin"; sticky.className = "stages__sticky";
    track.parentNode.insertBefore(wrapEl, track);
    sticky.appendChild(track); sticky.appendChild(foot); wrapEl.appendChild(sticky);
    var mq = matchMedia("(min-width: 1025px) and (min-height: 640px)"), dist = 0, last = -1;
    function measure() {
      track.style.transform = "";
      if (!mq.matches) { stages.classList.remove("is-pinned"); wrapEl.style.height = ""; return; }
      stages.classList.add("is-pinned");
      dist = Math.max(0, track.scrollWidth - track.clientWidth);
      if (dist < 40) { stages.classList.remove("is-pinned"); wrapEl.style.height = ""; return; }
      wrapEl.style.height = Math.round(sticky.offsetHeight + dist * 1.6) + "px";
    }
    measure();
    window.addEventListener("resize", measure);
    window.addEventListener("load", measure);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    return function update() {
      if (!stages.classList.contains("is-pinned")) return;
      var r = wrapEl.getBoundingClientRect();
      var travel = wrapEl.offsetHeight - sticky.offsetHeight || 1;
      var p = Math.min(1, Math.max(0, (navH() - r.top) / travel));
      track.style.transform = "translate3d(" + (-p * dist).toFixed(1) + "px,0,0)";
      stages.style.setProperty("--pin", p.toFixed(4));
      var idx = Math.min(n - 1, Math.floor(p * n * 0.9999));
      if (idx !== last && VP.setStage) { last = idx; VP.stageBase = idx; VP.setStage(idx); }
    };
  });

  /* -------------------------------------------- scroll-driven updates */
  safe("scroll", function () {
    var hero = document.getElementById("home");
    var copy = hero && hero.querySelector(".hero__copy");
    var eye = hero && hero.querySelector(".eyepiece");
    var queued = false;
    function update() {
      queued = false;
      var y = window.scrollY, max = root.scrollHeight - window.innerHeight;
      root.style.setProperty("--progress", max > 0 ? (y / max).toFixed(4) : 0);
      if (reduce) return;
      if (hero && copy) {
        var h = hero.offsetHeight;
        if (y < h * 1.2) {
          var p = Math.min(1, y / h);
          copy.style.transform = y > 0 ? "translate3d(0," + (-y * 0.18).toFixed(1) + "px,0)" : "";
          copy.style.opacity = (1 - p * 1.1).toFixed(3);
          if (eye) eye.style.rotate = (y * 0.03).toFixed(2) + "deg";
        }
      }
      if (pin) pin();
    }
    window.addEventListener("scroll", function () { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
    window.addEventListener("resize", update);
    update();
  });
})(window.VP);

</script>
